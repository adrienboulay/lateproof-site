# Publie la page sur GitHub Pages. La configuration Supabase (adresse + cle PUBLIQUE "publishable")
# est injectee depuis les secrets du depot, pour ne pas l'ecrire dans le code.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Generer config.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          mkdir -p public && cp index.html carte.html public/
          BASE=$(printf '%s' "$SUPABASE_URL" | sed -E 's#^(https://[^/]+).*#\1#')
          printf 'window.LP_CONFIG = {url: "%s", key: "%s"};\n' "$BASE" "$SUPABASE_PUBLISHABLE_KEY" > public/config.js
          [ -n "$BASE" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ] && echo "config ok" || echo "::warning::secrets manquants, la page s'affiche sans inscription"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
